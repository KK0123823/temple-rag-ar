services:
  db:
    image: pgvector/pgvector:pg16
    container_name: temple-rag-db-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temple
    ports:
      - "5432:5432"
    volumes:
      - temple-pg-data:/var/lib/postgresql/data

volumes:
  temple-pg-data:
